# =============================================================================
# Tempize — Docker Compose (Environnement de développement local)
# =============================================================================
# Usage:
#   docker compose up -d        → Démarrer les services
#   docker compose down         → Arrêter les services
#   docker compose down -v      → Arrêter + supprimer les volumes (reset BDD)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + PostGIS 3.4
  # ---------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: tempize-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tempize}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tempize_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tempize_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tempize} -d ${POSTGRES_DB:-tempize_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tempize-network

  # ---------------------------------------------------------------------------
  # Redis 7 (Cache in-memory pour les paquets de cartes swipe + positions GPS)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tempize-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tempize-network

  # ---------------------------------------------------------------------------
  # pgAdmin 4 (Interface web pour visualiser la BDD)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tempize-pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@tempize.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tempize-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  tempize-network:
    driver: bridge
